<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VINTO – ALWAYS ON TOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="/assets/vinto-logo.webp" fetchpriority="high">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Hanken+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Hanken+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet"></noscript>
<style>
:root{--ink:#000;--panel:#0c0c0d;--line:rgba(255,255,255,.12);--bone:#f5f5f6;--mute:#9c9fa5;--cobalt:#d4d7dc;--cobalt-lt:#c9cdd3;--accent:#e6e8eb;--chrome:linear-gradient(135deg,#fdfdfd 0%,#b9bdc3 22%,#f2f3f5 42%,#7e838a 62%,#dfe2e6 80%,#a7abb1 100%);--plate:#000;--display:'Unbounded','Arial Black','Helvetica Neue',Arial,sans-serif;--body:'Hanken Grotesk','Helvetica Neue',Arial,sans-serif;--ease:cubic-bezier(.16,.84,.2,1);--pad:clamp(18px,4.5vw,64px);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{overflow-x:hidden;overflow-x:clip;overscroll-behavior-x:none;scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);background:var(--ink)}
*,*::before,*::after{box-sizing:border-box;margin:0}
body{background:var(--ink);color:var(--bone);font-family:var(--body);font-size:1.0625rem;line-height:1.55;font-weight:500;-webkit-font-smoothing:antialiased;overflow-x:hidden;overflow-x:clip;overscroll-behavior-x:none;position:relative;width:100%;max-width:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ink);z-index:30}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--cobalt-lt);outline-offset:4px}
h1,h2,h3{font-family:var(--display);font-weight:900;line-height:1;letter-spacing:-.045em}

/* NAV */
#nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;height:70px;margin-bottom:-70px;display:flex;align-items:center;justify-content:space-between;padding:0 var(--pad);border-bottom:1px solid transparent;transition:background .4s,backdrop-filter .4s,border-color .4s}
#nav.scrolled{background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);border-color:var(--line)}
.logo{font-family:var(--display);font-weight:900;font-size:1.45rem;letter-spacing:-.06em;background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent}
.links{display:flex;gap:clamp(14px,3.2vw,44px)}
.links a{position:relative;font-weight:700;font-size:.95rem;color:var(--mute);transition:color .25s;padding:6px 0}
.links a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--cobalt);transform:scaleX(0);transform-origin:left;transition:transform .4s var(--ease)}
.links a:hover,.links a.active{color:var(--bone)}
.links a:hover::after,.links a.active::after{transform:scaleX(1)}

/* HERO */
.hero{min-height:100svh;position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "vis" "sub";align-content:center;gap:12px 3vw;padding:96px var(--pad) 112px;background:radial-gradient(60% 55% at 80% 40%,rgba(255,255,255,.07),transparent 70%)}
.hero-head{grid-area:head;align-self:end;font-size:clamp(2.2rem,10.4vw,4.2rem);text-transform:uppercase;margin-left:-.03em}
.hero-head em{font-style:normal;background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent}
.out{color:transparent;-webkit-text-stroke:2px var(--bone)}
.hero-sub{grid-area:sub;align-self:start;display:grid;gap:26px;justify-items:start;margin-top:clamp(8px,2vw,24px)}
.hero-sub p{max-width:34ch;color:var(--mute);font-size:1.15rem}
.stage{grid-area:vis;position:relative;min-height:min(46svh,440px);border-radius:18px;padding:1.5px;background:var(--chrome);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.stage::before{content:"";position:absolute;inset:1.5px;border-radius:16.5px;background:radial-gradient(ellipse at 50% 42%,#343434 0%,#1a1a1a 52%,#0b0b0b 100%)}
.stage::after{content:"";position:absolute;inset:1.5px;border-radius:16.5px;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.06),transparent 32%,transparent 70%,rgba(255,255,255,.03))}
.bob{position:absolute;inset:7% 8% 13%;z-index:1;animation:bob 6s ease-in-out infinite alternate}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:none}
.shadow{animation:shd 6s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(5px)}to{transform:translateY(-7px)}}
@keyframes shd{from{transform:translateX(-50%) scale(1.02);opacity:.55}to{transform:translateX(-50%) scale(.9);opacity:.35}}
@media(prefers-reduced-motion:reduce){.bob,.spin,.shadow{animation:none}}
.shadow{position:absolute;z-index:1;left:50%;bottom:7%;width:56%;height:4%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.12),transparent);transform:translateX(-50%)}
.scroll{position:absolute;z-index:1;left:50%;bottom:26px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:700;font-size:.85rem;color:var(--mute);animation:pulse 1.9s ease-in-out infinite}
.scroll .bar{position:relative;display:block;width:2px;height:46px;border-radius:2px;background:var(--line);overflow:hidden}
.scroll .bar::after{content:"";position:absolute;left:0;top:0;width:100%;height:40%;background:var(--bone);animation:drip 1.9s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes drip{from{transform:translateY(-100%)}to{transform:translateY(260%)}}
@media(min-width:900px){.hero{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);grid-template-areas:"head vis" "sub vis"}.hero-head{font-size:clamp(3rem,5vw,5.6rem)}.stage{min-height:min(72svh,680px)}}
.btn{display:inline-block;font-weight:800;font-size:1rem;padding:17px 30px;border-radius:999px;background:var(--chrome);background-size:160% 160%;background-position:0 0;color:#0a0a0a;border:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 6px 18px rgba(0,0,0,.4);cursor:pointer;font-family:var(--body);transition:transform .3s var(--ease),background-position .6s var(--ease)}
.btn:hover{background-position:100% 100%;transform:translateY(-3px)}
.btn.ghost{background:transparent;color:var(--bone);border:1.5px solid var(--bone);box-shadow:none}
.btn.ghost:hover{background:var(--bone);color:var(--ink)}
.cta{display:flex;gap:12px;flex-wrap:wrap}

/* MARQUEE */
.marquee{overflow:hidden;border-block:1px solid var(--line);padding:18px 0;background:var(--chrome);color:var(--ink)}
.track{display:flex;width:max-content;animation:run 28s linear infinite;font-family:var(--display);font-weight:900;font-size:clamp(1.2rem,2.6vw,2rem);letter-spacing:-.04em;text-transform:uppercase}
.track span{padding-right:2.2rem;white-space:nowrap}
@keyframes run{to{transform:translateX(-50%)}}

/* SECTIONS */
section{padding:clamp(80px,12vw,170px) var(--pad)}
h2{font-size:clamp(2rem,6.4vw,6rem)}
.drop{display:grid;gap:clamp(40px,6vw,90px)}
.drop-grid{display:grid;grid-template-columns:1fr;gap:32px 64px}
.drop-grid p{color:var(--mute);font-size:1.2rem;max-width:44ch}
.specs{list-style:none;padding:0}
.specs li{display:flex;justify-content:space-between;gap:20px;padding:18px 0;border-top:1px solid var(--line);font-weight:700;font-size:1.1rem}
.specs li:last-child{border-bottom:1px solid var(--line)}
.specs span{color:var(--cobalt-lt);font-family:var(--display);font-weight:800;font-size:.95rem;text-align:right}
@media(min-width:860px){.drop-grid{grid-template-columns:1fr 1fr}}

.shop-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:clamp(36px,5vw,64px)}
.shop-head p{color:var(--mute);max-width:32ch}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
.card{display:flex;flex-direction:column;gap:14px}
.art{flex:1;min-height:300px;border-radius:6px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:22px;background:var(--bg,var(--panel));border:1px solid var(--line);transition:border-color .4s}
.art b{font-family:var(--display);font-weight:900;font-size:clamp(2.6rem,9vw,7.5rem);letter-spacing:-.06em;line-height:.8;color:transparent;-webkit-text-stroke:1.5px var(--bone);transition:color .5s var(--ease)}
.art i{position:absolute;top:18px;left:22px;font-style:normal;font-weight:800;font-size:.8rem;padding:5px 11px;border-radius:99px;background:var(--bone);color:var(--ink)}
.card:hover .art{border-color:var(--cobalt-lt)}
.card:hover .art b{color:var(--bone)}
.meta{display:flex;justify-content:space-between;gap:16px}
.meta h3{font-size:1.1rem;letter-spacing:-.03em}
.meta p{color:var(--mute);font-size:.95rem;margin-top:4px}
.meta strong{font-family:var(--display);font-weight:800;font-size:1.05rem}
.buy{display:block;text-align:center;font-weight:800;padding:13px 20px;border-radius:99px;border:1.5px solid var(--bone);transition:background .3s,color .3s}
.buy:hover{background:var(--bone);color:var(--ink)}
.buy.off{border-color:var(--line);color:var(--mute);pointer-events:none}
.navr{display:flex;align-items:center;gap:clamp(12px,2.6vw,36px)}
.cartbtn{display:flex;align-items:center;gap:6px;background:none;border:0;color:var(--bone);cursor:pointer;padding:6px}
.cartbtn svg{width:22px;height:22px}
#cc{font-size:.75rem;font-weight:800;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--chrome);color:#000;display:grid;place-items:center}
#cc[hidden]{display:none}
.card .art,.card .meta{cursor:pointer}
button.buy{width:100%;background:none;color:var(--bone);font:inherit;font-weight:800;cursor:pointer}
.buy.on{background:var(--bone);color:var(--ink)}
.grid>.card.wide:nth-child(n){grid-column:1/-1}
.card.wide .art{aspect-ratio:4/3}
.art.two img{width:50%;padding:4%}
.art.two .b{left:50%;opacity:1}
@media(min-width:900px){.card.wide .art{aspect-ratio:auto;height:clamp(280px,34vw,480px)}}
.modal,.cart{position:fixed;inset:0;z-index:60;display:none}
.modal.open,.cart.open{display:block}
.mback,.cback{position:absolute;inset:0;background:rgba(0,0,0,.78);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.mbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(980px,calc(100% - 28px));max-height:calc(100% - 28px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:grid;grid-template-columns:1fr}
@media(min-width:760px){.mbox{grid-template-columns:1.05fr 1fr}}
.mimg{position:relative;background:radial-gradient(ellipse at 50% 42%,#343434 0%,#1a1a1a 52%,#0b0b0b 100%);aspect-ratio:4/5}
.mimg>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:8%;mix-blend-mode:normal}
.mimg>img.cn{padding:0;mix-blend-mode:normal}
.mth{position:absolute;left:12px;bottom:12px;display:flex;gap:8px}
.mth button{width:54px;height:54px;border:1.5px solid rgba(255,255,255,.25);border-radius:6px;background:#000;padding:0;cursor:pointer;overflow:hidden}
.mth button.on{border-color:var(--bone)}
.mth img{width:100%;height:100%;object-fit:contain}
.minfo{padding:clamp(22px,3vw,40px);display:flex;flex-direction:column;gap:14px;justify-content:center}
.minfo h3{font-size:clamp(1.6rem,3vw,2.4rem)}
.mp{font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--cobalt-lt)}
#md{color:var(--mute)}
#ml{list-style:none;padding:0}
#ml li{padding:11px 0;border-top:1px solid var(--line);font-weight:700}
#ml li:last-child{border-bottom:1px solid var(--line)}
.mn{color:var(--mute);font-size:.92rem}
.mbtns{display:flex;gap:10px;flex-wrap:wrap}
.mbtns .btn{flex:1 1 150px;text-align:center}
.x{position:absolute;top:8px;right:10px;z-index:3;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:var(--bone);font-size:1.5rem;cursor:pointer}
.cpanel{position:absolute;top:0;right:0;bottom:0;width:min(430px,100%);background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 20px;animation:slidein .35s var(--ease)}
@keyframes slidein{from{transform:translateX(100%)}}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ch h3{font-size:1.4rem}
.ch .x{position:static;background:none}
#citems{flex:1;overflow:auto}
.empty{color:var(--mute);padding:24px 0}
.ci{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
.ci img{width:72px;height:90px;object-fit:contain;background:var(--plate);border-radius:4px;mix-blend-mode:normal}
.ci>div{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.ci .ctl{flex-direction:row;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap}
.ci select{background:#000;color:var(--bone);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:.9rem}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.qty button{width:30px;height:30px;background:none;border:0;color:var(--bone);font-size:1.1rem;cursor:pointer}
.qty b{min-width:24px;text-align:center;font-size:.95rem}
.ci .lt{color:var(--bone);font-weight:800}
.cf .btn{width:100%;margin-top:12px;text-align:center;border:0;cursor:pointer;font:inherit;font-weight:800}
.cf .btn[disabled]{opacity:.5;pointer-events:none}
.cf .err{color:#ff9d9d}
.cf .alts a{text-decoration:underline;margin-right:10px}
.sw{display:flex;align-items:center;gap:9px;min-height:26px}
.sw:empty{display:none}
.swb{width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);padding:0;cursor:pointer;box-shadow:0 0 0 2px transparent;transition:box-shadow .2s,transform .2s}
.swb:hover{transform:scale(1.08)}
.swb.on{box-shadow:0 0 0 2px #000,0 0 0 3.5px var(--bone)}
.swn{font-size:.9rem;color:var(--mute)}
.minfo .sw{margin:2px 0 4px}
.ci span{color:var(--mute)}
.btn.off{opacity:.45;pointer-events:none}
.btn.sm{padding:9px 20px;font-size:.9rem;margin-top:6px}
.rm{background:none;border:0;color:var(--mute);font-size:1.5rem;cursor:pointer;line-height:1}
.cf{border-top:1px solid var(--line);padding-top:14px}
.ct{display:flex;justify-content:space-between;font-weight:800;font-size:1.15rem}
.cf p{color:var(--mute);font-size:.9rem;margin-top:8px}
@media(max-width:520px){.navr{gap:10px}.cartbtn svg{width:20px;height:20px}}
.art{flex:none;min-height:0;aspect-ratio:4/5;padding:0;display:block;background:radial-gradient(ellipse at 50% 42%,#343434 0%,#1a1a1a 52%,#0b0b0b 100%)}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:7%;mix-blend-mode:normal;transition:opacity .5s,transform .8s var(--ease)}
.art img.cn{padding:0;mix-blend-mode:normal}
.art .b{opacity:0}

.art.hb:hover .f{opacity:0}.art.hb:hover .b{opacity:1}
.card:hover .art:not(.hb) img{transform:scale(1.04)}
.art i{background:var(--bone);color:var(--ink);z-index:2}
@media(min-width:900px){.grid{grid-template-columns:repeat(3,1fr)}.grid .card:nth-child(n){grid-column:auto}.grid .card:nth-child(n) .art{min-height:0}}
@media(min-width:900px){
.grid{grid-template-columns:repeat(12,1fr)}
.card{grid-column:span 4}
.card:nth-child(1){grid-column:span 7}.card:nth-child(2){grid-column:span 5}
.card:nth-child(6){grid-column:span 12}
.card:nth-child(-n+2) .art{min-height:520px}.card:nth-child(6) .art{min-height:300px}
.card:nth-child(n+3):nth-child(-n+5) .art{min-height:380px}}

.look{background:var(--panel);border-block:1px solid var(--line)}
.look h2{max-width:15ch;margin-bottom:clamp(40px,6vw,80px)}
.lbgrid{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.lbgrid figure{margin:0;border-radius:6px;overflow:hidden;background:var(--ink);border:1px solid var(--line);aspect-ratio:3/4}
.lbgrid img{display:block;width:100%;height:100%;object-fit:cover}
@media(min-width:860px){.lbgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}

.join{text-align:left}
.join h2{max-width:13ch}
.signup{display:flex;flex-wrap:wrap;gap:12px;margin-top:clamp(28px,4vw,48px);max-width:620px}
.signup input{flex:1 1 260px;font:inherit;font-weight:700;color:var(--bone);background:transparent;border:0;border-bottom:2px solid var(--line);padding:16px 2px;border-radius:0;transition:border-color .3s}
.signup input:focus{outline:0;border-color:var(--cobalt-lt)}
.signup input::placeholder{color:var(--mute)}
#msg{margin-top:18px;min-height:1.6em;color:var(--cobalt-lt);font-weight:700}

footer{padding:0 var(--pad) 28px;overflow:hidden}
.mark{font-family:var(--display);font-weight:900;font-size:clamp(5rem,31vw,30rem);letter-spacing:-.08em;line-height:.82;margin-left:-.05em;color:transparent;-webkit-text-stroke:2px var(--line)}
.legal{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding-top:22px;border-top:1px solid var(--line);color:var(--mute);font-size:.95rem}
.ig{display:inline-flex;align-items:center;gap:8px;color:var(--bone);font-weight:700;text-decoration:none;transition:color .3s}
.ig:hover,.ig:focus-visible{color:var(--cobalt-lt)}

/* SCROLL ANIMATION SYSTEM: data-reveal="up|left|right|scale|fade|wipe|mask", data-delay, data-stagger */
.js [data-reveal]{opacity:0;transition:opacity .9s var(--ease),transform 1s var(--ease),clip-path 1.1s var(--ease);transition-delay:var(--d,0s);will-change:transform,opacity}
.js [data-reveal=up]{transform:translateY(44px)}
.js [data-reveal=left]{transform:translateX(-70px)}
.js [data-reveal=right]{transform:translateX(70px)}
.js [data-reveal=scale]{transform:scale(.9)}
.js [data-reveal=wipe]{transform:translateY(56px) scale(.97)}
.js [data-reveal=mask]{opacity:1}
.js [data-reveal].in{opacity:1;transform:none;clip-path:inset(0)}
.line{display:block;overflow:hidden;padding:.06em 0;margin:-.06em 0}
.line>span{display:block}
.js [data-reveal=mask] .line>span{transform:translateY(112%);transition:transform 1.15s var(--ease);transition-delay:calc(var(--d,0s) + var(--i,0)*.13s)}
.js [data-reveal=mask].in .line>span{transform:none}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.track,.scroll,.scroll .bar::after{animation:none}.js [data-reveal],.js [data-reveal] .line>span{transition:none!important;opacity:1!important;transform:none!important;clip-path:none!important}}
@media(max-width:520px){.links a{font-size:.8rem}.logo{font-size:1.2rem}.links{gap:13px}.out{-webkit-text-stroke-width:1.4px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(3,1fr)}.grid>.card:nth-child(n){grid-column:auto}.grid>.card.wide:nth-child(n){grid-column:1/-1}.grid>.card:nth-child(n) .art{min-height:0}}
@media(min-width:760px){.mimg{aspect-ratio:auto;min-height:440px}.minfo{gap:12px;padding:28px 32px}#ml li{padding:9px 0}}
@media(max-width:759px){.mimg{aspect-ratio:1/1}}
.mbtns .btn{white-space:nowrap}
@media(max-width:520px){.mbtns .btn{flex:1 1 100%}}
#intro{position:fixed;inset:0;z-index:9999;background:#000;display:grid;place-items:center;transition:opacity .7s ease .45s,visibility 0s 1.15s}
#intro button{all:unset;cursor:pointer;display:grid;justify-items:center;gap:22px;text-align:center;transition:transform 1.1s cubic-bezier(.7,0,.3,1)}
#intro img{width:min(78vw,760px);height:auto;filter:drop-shadow(0 0 30px rgba(255,255,255,.18))}
#intro .tag{font-family:var(--display);font-weight:900;font-size:clamp(1.4rem,4vw,2.4rem);letter-spacing:.1em;background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent}
#intro .hint{color:var(--mute);font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:.8rem;animation:pulse 1.8s ease-in-out infinite}
